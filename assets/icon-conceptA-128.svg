<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#4B0082" />
      <stop offset="100%" stop-color="#1FA2A6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- rounded background -->
  <rect x="4" y="4" width="120" height="120" rx="20" fill="url(#bgGrad)" />

  <!-- workflow lines -->
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
    <path d="M36 42 C56 30, 72 30, 92 42" />
    <path d="M36 86 C56 98, 72 98, 92 86" />
    <path d="M64 48 L64 80" />
  </g>

  <!-- nodes -->
  <g fill="#FFFFFF" stroke="none">
    <circle cx="36" cy="42" r="6" />
    <circle cx="64" cy="48" r="6" />
    <circle cx="92" cy="42" r="6" />
    <circle cx="36" cy="86" r="6" />
    <circle cx="64" cy="80" r="6" />
    <circle cx="92" cy="86" r="6" />
  </g>

  <!-- magnifier (accent) -->
  <g transform="translate(72,72)" filter="url(#shadow)">
    <circle cx="12" cy="12" r="12" fill="#FFFFFF" opacity="0.06" />
    <circle cx="8" cy="8" r="10" fill="#FFFFFF" stroke="#FF8C42" stroke-width="3" />
    <rect x="16" y="16" width="18" height="4" rx="2" transform="rotate(45 16 16)" fill="#FF8C42" />
    <!-- highlight node under magnifier -->
    <circle cx="8" cy="8" r="3" fill="#FF8C42" />
  </g>
</svg>

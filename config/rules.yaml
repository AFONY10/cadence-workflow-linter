rules:
  TimeUsage:
    description: "Use Cadence workflow clock instead of system time."
    default_severity: error
    message: "Detected %FUNC%() in workflow. Use workflow.Now(ctx)/workflow.Sleep(ctx) instead."

    languages:
      go:
        function_calls:
          - import: time
            functions: [Now, Since, Sleep]

      java:
        method_calls:
          - package: java.time
            types: []        # any type in java.time using now()
            methods: [now]
          - package: java.lang
            types: [System]
            methods: [currentTimeMillis]

  Randomness:
    description: "Use deterministic patterns or workflow.SideEffect instead of random APIs."
    default_severity: error
    message: "Detected %FUNC%() in workflow. Avoid nondeterminism; use workflow.SideEffect if needed."

    languages:
      go:
        function_calls:
          - import: math/rand
            functions: [Intn, Int, Float32, Float64, Read]

      java:
        method_calls:
          - package: java.util
            types: [Random]
            methods: [nextInt, nextDouble, nextFloat, nextLong]
          - package: java.util.concurrent
            types: [ThreadLocalRandom]
            methods: [current, nextInt, nextDouble, nextLong]

  IOCalls:
    description: "Avoid direct I/O in workflows; delegate to activities."
    default_severity: error
    message: "Detected %FUNC%() in workflow. Avoid file or console I/O inside workflows."

    languages:
      go:
        function_calls:
          - import: os
            functions: [Open, OpenFile, ReadFile, WriteFile, Mkdir, Remove]
            severity: error
          - import: fmt
            functions: [Println, Printf, Print]
            severity: warning
            message: "Detected %FUNC%() in workflow. Use workflow.GetLogger(ctx) instead."

      java:
        method_calls:
          - package: java.nio.file
            types: [Files]
            methods: [readAllBytes]
            severity: error
          - package: java.io
            types: [FileInputStream, FileOutputStream]
            methods: [read, write]
            severity: error
          - package: java.io
            types: [PrintStream]
            methods: [println, print, printf]
            severity: warning
            message: "Detected %FUNC%() in workflow. Use Workflow.getLogger() instead."

  Network:
    description: "Network calls must be performed via activities."
    default_severity: error
    message: "Detected HTTP/network call in workflow. Use workflow activities instead."

    languages:
      go:
        function_calls:
          - import: net/http
            functions: [Get, Post, Do, Head]

      java:
        method_calls:
          - package: java.net.http
            types: [HttpClient]
            methods: [send, sendAsync]

  MapIteration:
    description: "Map iteration order is nondeterministic in Go."
    default_severity: warning
    message: "Detected map iteration in workflow. Map iteration order in Go is nondeterministic; sort keys or otherwise ensure deterministic behavior."

    languages:
      go:
        ast_patterns:
          - kind: range_over_map   # adapter-specific keyword; you interpret it

  ImportRandom:
    description: "Discourage math/rand in files that contain workflows."
    default_severity: warning
    message: "Importing math/rand in files with workflows is discouraged; consider deterministic alternatives."

    languages:
      go:
        imports:
          disallowed:
            - path: math/rand

  UUIDGeneration:
    description: "UUID generation is nondeterministic and must be wrapped in SideEffect."
    default_severity: error
    message: "UUID generation is non-deterministic. Use workflow.SideEffect for UUID generation in workflows."

    languages:
      go:
        function_calls:
          - import: github.com/google/uuid
            functions: [New, NewRandom, NewString]

      java:
        method_calls:
          - package: java.util
            types: [UUID]
            methods: [randomUUID]

  HTTPClient:
    description: "HTTP clients should be used from activities, not directly from workflows."
    default_severity: error
    message: "HTTP calls should be performed in activities, not directly in workflows."

    languages:
      go:
        function_calls:
          - import: github.com/go-resty/resty/v2
            functions: [Get, Post, Put, Delete, Execute]

  RedisOperations:
    description: "Redis operations should be performed in activities."
    default_severity: error
    message: "Redis operations should be performed in activities to ensure workflow determinism."

    languages:
      go:
        function_calls:
          - import: github.com/go-redis/redis/v8
            functions: [Get, Set, Del, Exists, Incr, Decr, HGet, HSet]

safe_imports:
  go:
    - github.com/pkg/errors
    - go.uber.org/zap
    - github.com/stretchr/testify
    - golang.org/x/crypto/bcrypt

  java:
    - org.slf4j
    - com.google.guava

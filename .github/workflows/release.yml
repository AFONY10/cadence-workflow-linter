name: Build & Release

# Grant the workflow permission to create Releases and write repository contents.
# The default GITHUB_TOKEN permission may be read-only depending on repo settings;
# explicitly request write access so the softprops release action can create releases.
permissions:
  contents: write
  packages: write

on:
  push:
    tags: ['v*']

jobs:
  build-cli:
    name: Build CLI (matrix)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            arch: amd64
            out: cadence-linter-linux-amd64
          - goos: linux
            arch: arm64
            out: cadence-linter-linux-arm64
          - goos: darwin
            arch: amd64
            out: cadence-linter-darwin-amd64
          - goos: darwin
            arch: arm64
            out: cadence-linter-darwin-arm64
          - goos: windows
            arch: amd64
            out: cadence-linter-windows-amd64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          echo "Building for $GOOS/$GOARCH -> dist/${{ matrix.out }}"
          CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -ldflags='-s -w' -o "dist/${{ matrix.out }}" ./cmd/cadence-linter

      - name: Create checksum
        run: |
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            sha256sum "${{ matrix.out }}" | awk '{print $1}' > "${{ matrix.out }}.sha256"
          else
            sha256sum "${{ matrix.out }}" | awk '{print $1}' > "${{ matrix.out }}.sha256"
          fi

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          # make the artifact name unique per matrix entry to avoid 409 conflicts
          name: cli-artifacts-${{ matrix.goos }}-${{ matrix.arch }}
          # upload only the built binary and its checksum
          path: |
            dist/${{ matrix.out }}
            dist/${{ matrix.out }}.sha256

  package-vsix:
    name: Package VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Use Node 20.x to satisfy modern package engine requirements (undici, vsce)
          node-version: '20.18.1'

      - name: Install npm deps
        working-directory: vscode-extension
        # `npm ci` requires a package-lock.json; fall back to `npm install` if absent
        run: npm ci || npm install --no-audit --no-fund

      - name: Compile extension
        working-directory: vscode-extension
        run: npm run compile

      - name: Package VSIX
        working-directory: vscode-extension
        run: npx vsce package --no-dependencies

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-artifact
          path: vscode-extension/*.vsix

  create-release:
    name: Create GitHub Release and upload artifacts
    runs-on: ubuntu-latest
    needs: [build-cli, package-vsix]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        # download everything uploaded by earlier jobs into ./artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Move artifacts into release paths
        run: |
          mkdir -p dist
          mkdir -p vscode-extension
          # find and copy binaries and checksums into dist/
          find artifacts -type f -name 'cadence-linter-*' -exec cp {} dist/ \;
          # find and copy the vsix into vscode-extension/
          find artifacts -type f -name '*.vsix' -exec cp {} vscode-extension/ \;

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*
            vscode-extension/*.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

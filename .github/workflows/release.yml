name: Build & Release

on:
  push:
    tags: ['v*']

jobs:
  build-cli:
    name: Build CLI (matrix)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            arch: amd64
            out: cadence-linter-linux-amd64
          - goos: linux
            arch: arm64
            out: cadence-linter-linux-arm64
          - goos: darwin
            arch: amd64
            out: cadence-linter-darwin-amd64
          - goos: darwin
            arch: arm64
            out: cadence-linter-darwin-arm64
          - goos: windows
            arch: amd64
            out: cadence-linter-windows-amd64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          echo "Building for $GOOS/$GOARCH -> dist/${{ matrix.out }}"
          CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -ldflags='-s -w' -o "dist/${{ matrix.out }}" ./cmd/cadence-linter

      - name: Create checksum
        run: |
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            sha256sum "${{ matrix.out }}" | awk '{print $1}' > "${{ matrix.out }}.sha256"
          else
            sha256sum "${{ matrix.out }}" | awk '{print $1}' > "${{ matrix.out }}.sha256"
          fi

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-artifacts
          path: dist/*

  package-vsix:
    name: Package VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm deps
        working-directory: vscode-extension
        run: npm ci

      - name: Compile extension
        working-directory: vscode-extension
        run: npm run compile

      - name: Package VSIX
        working-directory: vscode-extension
        run: npx vsce package --no-dependencies

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-artifact
          path: vscode-extension/*.vsix

  create-release:
    name: Create GitHub Release and upload artifacts
    runs-on: ubuntu-latest
    needs: [build-cli, package-vsix]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          name: cli-artifacts
          path: ./dist

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix-artifact
          path: ./vscode-extension

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*
            vscode-extension/*.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
